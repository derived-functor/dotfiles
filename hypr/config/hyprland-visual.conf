source = ~/.config/hypr/colors.conf

general {
    gaps_in = 4
    gaps_out = 4
    border_size = 3

	col.active_border   = $accent $border 45deg
    col.inactive_border = $bg2
    resize_on_border    = false
    allow_tearing       = false
    layout              = master
}

decoration {
    rounding = 0
    rounding_power = 2
    active_opacity = 1.00
    inactive_opacity = 0.85
    shadow {
        enabled = true
        range = 4
        render_power = 3
		color = rgba($shadowAlphaee)
    }
}

$speed = 5.5

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,  0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,        0,0,1,1
    bezier = almostLinear,  0.5,0.5,0.75,1.0
    bezier = quick,         0.15,0,0.1,1

	bezier = smoothIn,  0.36, 0,     0.66, -0.56
	bezier = smoothOut, 0.34, 1.56,  0.64, 1
	bezier = overshot,  0.4,  0.8,   0.2,  1.2
	bezier = floaty,    0.1,  0.78,  0.3,  1.25
	bezier = mine,      0.59, 0.00,  0.42, 1.20
	bezier = mine2,     0.48, -0.55, 0.71, 0.94

    # From superAnonymous video
	bezier = wind,      0.05, 0.1,   1,    1.05
	bezier = winIn,     -1.0,  0.1,  0.3,  1.3
	bezier = winOut,    0.3,  -0.3,  1,    1

    animation = global,        1, 10,     default
    animation = border,        1, 5.39,   easeOutQuint
	animation = windows,       1, 7,      floaty
	animation = windowsIn,     1, $speed, winIn
	animation = windowsOut,    1, $speed, winOut
	animation = windowsMove,   1, 3.7,    quick
    animation = fadeIn,        1, 1.73,   almostLinear
    animation = fadeOut,       1, 1.46,   almostLinear
	animation = fade,          1, 5,      smoothIn
    animation = layers,        1, 3.81,   easeOutQuint
    animation = layersIn,      1, 4,      easeOutQuint, fade
    animation = layersOut,     1, 1.5,    linear,       fade
    animation = fadeLayersIn,  1, 1.79,   almostLinear
    animation = fadeLayersOut, 1, 1.39,   almostLinear
	animation = workspaces,    1, 2,     wind,    
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = slave
}

misc {
    force_default_wallpaper = 1
    disable_hyprland_logo = true
}
